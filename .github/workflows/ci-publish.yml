name: CI & Publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build Packages
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Lint
        run: bun run lint

  publish:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write # required for npm Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          package-manager-cache: false # never use caching in release builds

      - name: Install dependencies
        run: bun install

      - name: Build all packages
        run: bun run build

      - name: Enforce lockstep versions
        run: bun scripts/check-lockstep.ts

      # npm's Trusted Publishing (OIDC) requires an OIDC token exchange,
      # which bun is missing (https://github.com/oven-sh/bun/issues/22423),
      # so the actual publish step below uses `npm publish` instead.
      - name: Setup Node (for OIDC trusted publishing)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish packages (in dependency order)
        # Packages are published one-by-one in dependency order because bun
        # workspaces resolve workspace:* references locally and npm requires
        # each dependency to already exist on the registry before dependents.
        #
        # Packing is done with `bun pm pack`, which resolves each package's
        # `workspace:*` dependency ranges to the real, currently-installed
        # workspace version before the tarball is created (unlike plain `npm
        # pack`, which leaves `workspace:*` untouched). The resulting tarball
        # is then published with `npm publish` so that npm's Trusted
        # Publishing (OIDC) flow, set up via the `id-token: write` permission
        # and the npm registry's trusted publisher configuration, can
        # authenticate the request without a static token.
        run: |
          set -euo pipefail
          for pkg in core rdf export-apple export-dict dbnary wordnet; do
            (
              cd "packages/$pkg"
              tarball=$(bun pm pack --gzip-level 9 --quiet)
              npm publish "$tarball" --access public
            )
          done
